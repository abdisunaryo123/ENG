.opt.ok{background:#b8f0c8}.opt.no{background:#ffc9ce;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.bar{height:14px;background:#fff;border-radius:99px;border:2px solid var(--ink);overflow:hidden}

.mc.sel{background:var(--mango)}.mc.done{background:#b8f0c8;opacity:.7}

.shop span.e{font-size:2em}.shop .n{flex:1}.shop button{padding:.2em .8em}
.bub{background:var(--mango);border-radius:18px;padding:.7em 1em;font-weight:700}
.toast{position:fixed;top:70px;right:12px;background:var(--tom);color:#fff;padding:.6em 1em;border-radius:14px;animation:pop .3s;z-index:9}
.stars{font-size:2.4em;text-align:center}
.row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;margin-top:.8em}
.ach{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:.2em .8em;margin:.2em;opacity:.4}
.ach.on{opacity:1;background:var(--mango)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

var AC={first:"🥇 Pembelanja Pertama",star3:"⭐ Bintang Sempurna",combo5:"🔥 Combo Master",coin100:"🪙 Kolektor Koin",all:"👑 Juara English Fun"};

try{var sv=JSON.parse(localStorage.getItem("englishfun5")||"null");if(sv&&typeof sv==="object")P=Object.assign(P,sv)}catch(e){}
function save(){try{localStorage.setItem("englishfun5",JSON.stringify(P))}catch(e){}}
var G=null,$=function(s){return document.querySelector(s)},app=$("#app");

function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
/* ===== AUDIO ===== */
var ac=null,mus=false,mt=null,mi=0;
function snd(f,d,t,v){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.12));o.stop(ac.currentTime+(d||.12))}catch(e){}}
function sOk(){snd(660);setTimeout(function(){snd(880)},90)}
function sBad(){snd(200,.2,"triangle")}
function sWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){snd(f,.2)},i*120)})}

function unlock(k){if(!P.ach[k]){P.ach[k]=1;toast("🏆 Pencapaian: "+AC[k]);save()}}
/* ===== MENU ===== */
function menu(){

function intro(i){var l=L[i];G={li:i,ri:0,score:0,mist:0,combo:0,mc:0,hint:0,tried:0};
  app.innerHTML='<div class="card"><div class="big">'+l.i+'</div><h2 style="text-align:center">Level '+(i+1)+': '+esc(l.n)+'</h2><p>📖 <b>Misi:</b> '+esc(l.s)+'</p><p>🎯 <b>Tujuan belajar:</b> '+esc(l.g)+'</p><p>✅ <b>Syarat selesai:</b> Selesaikan semua '+l.r.length+' tantangan. Boleh mencoba lagi kalau salah!</p><div class="row"><button class="alt" onclick="menu()">◀ Menu</button><button onclick="round()">Mulai! ▶</button></div></div>'}
/* ===== ROUND ===== */
function round(){var l=L[G.li],r=G.r=l.r[G.ri];G.tried=0;G.hint=0;G.done=false;
  app.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;gap:.5em;flex-wrap:wrap"><b>Level '+(G.li+1)+' • '+esc(l.n)+'</b><span>Skor '+G.score+(G.combo>1?' • 🔥 Combo x'+G.combo:'')+'</span></div><div class="bar"><i style="width:'+(G.ri/l.r.length*100)+'%"></i></div><div id="st" style="margin-top:.8em"></div><div id="fb">Ayo coba! 😊</div><div class="row"><button class="alt" id="hb" onclick="hint()">💡 Petunjuk</button><button id="nx" style="display:none" onclick="nextR()">Lanjut ▶</button><button class="alt" onclick="if(confirm(\'Keluar ke menu?\'))menu()">Menu</button></div></div>';

  if(!t){if(r.t=="mcq")t="Baca soal pelan-pelan. Salah satu pilihan yang tidak cocok: <b>"+esc(r.o[(r.a+1)%r.o.length])+"</b>.";

function good(){G.done=true;var first=!G.tried&&!G.hint;G.combo++;if(G.combo>G.mc)G.mc=G.combo;

function order(r,el){var ws=shuf(r.w.map(function(w,i){return{w:w,i:i}}));if(ws.length>1&&ws.every(function(x,i){return x.i==i}))ws.reverse();var pool=ws,ans=[];

  function draw(){var tot=0,h='<div class="bub">🧑‍🍳 Customer: “'+esc(r.q)+'”</div>';
    for(var k in PR){tot+=c[k]*PR[k];h+='<div class="shop"><span class="e">'+IC[k]+'</span><span class="n"><b>'+k+'</b> <small>Rp'+PR[k].toLocaleString("id-ID")+'</small></span><button data-k="'+k+'" data-d="-1" aria-label="kurang">−</button><b style="min-width:1.5em;text-align:center">'+c[k]+'</b><button data-k="'+k+'" data-d="1" aria-label="tambah">+</button></div>'}
    h+='<p>🛒 Total belanja: <b>Rp'+tot.toLocaleString("id-ID")+'</b></p><div class="row"><button id="ck">Bayar ✔</button></div>';el.innerHTML=h;
    el.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){if(G.done)return;var k=b.dataset.k;c[k]=Math.max(0,Math.min(9,c[k]+ +b.dataset.d));snd(500,.05);draw()}});
    $("#ck").onclick=function(){if(G.done)return;var ok=true;for(var k in PR)if((r.need[k]||0)!==c[k])ok=false;
      if(ok){r.f="Pesanan benar! Total: Rp"+tot.toLocaleString("id-ID")+". Thank you!";good()}else bad("Keranjangmu belum sesuai pesanan. Baca lagi kalimatnya.")}}
  draw()}
/* ===== RESULT ===== */
function finish(){var i=G.li,st=G.mist==0?3:G.mist<=3?2:1;G.score+=st*10;P.coins+=st*5;
  if((P.stars[i]||0)<st)P.stars[i]=st;if((P.best[i]||0)<G.score)P.best[i]=G.score;
  unlock("first");if(st==3)unlock("star3");if(P.coins>=100)unlock("coin100");
  var all=true;L.forEach(function(x,k){if(!P.stars[k])all=false});if(all)unlock("all");save();hud();sWin();
  var nxt=i<L.length-1;
  app.innerHTML='<div class="card"><h2 style="text-align:center">🎉 Level '+(i+1)+' Selesai!</h2><div class="stars">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</div><p style="text-align:center">Skor: <b>'+G.score+'</b> (terbaik '+P.best[i]+') • Kesalahan: '+G.mist+' • Combo terbaik: '+G.mc+'<br>🪙 Koin total: '+P.coins+'</p><p style="text-align:center">'+(st==3?"Sempurna! Kamu hebat!":st==2?"Bagus! Coba lagi untuk 3 bintang.":"Terus berlatih, kamu pasti bisa!")+'</p><div class="row"><button class="alt" onclick="menu()">Menu</button><button class="alt" onclick="intro('+i+')">Ulangi 🔁</button>'+(nxt?'<button onclick="intro('+(i+1)+')">Level berikutnya ▶</button>':'<button onclick="menu()">🏆 Kamu Juara!</button>')+'</div></div>'}
menu();
</script></body></html>
